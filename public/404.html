<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dancing Roamer</title>
    <!--
      GitHub Pages SPA fallback (rafgraph/spa-github-pages pattern).
      GH Pages serves this file for any unknown path (e.g. /about on a
      hard refresh). It re-encodes the path into a query string and sends
      the browser to index.html, which decodes it back via history API
      before React Router takes over — so deep links & refreshes work.
    -->
    <script type="text/javascript">
      // TEMPORARY: 1 while deployed under the /dancing-roamer-website/
      // subpath on github.io. Change back to 0 once served from the root
      // of the dancingroamer.in custom domain (matches vite.config.js base).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
